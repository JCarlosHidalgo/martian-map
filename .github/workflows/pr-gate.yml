# The check that the `main` ruleset requires on every pull request ("pr-gate").
# It runs on every PR (no path filter), so no PR waits for a status that never comes.
# Repository hygiene always; the .NET packages (Routing/, Edits/) are built and tested only when a
# change touches them, and the Python projects (server/, ingest/) run pytest only when a change
# touches them. Checks that depend on paths stay as steps of this one job, never as separate
# required checks: a required check that is skipped by a path filter blocks the PR forever.
# The contracts workflow (P6) stays separate.
name: PR gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without LFS downloads
        uses: actions/checkout@v4
        with:
          lfs: false
          # Full history, to compare the change against its base.
          fetch-depth: 0

      - name: Detect what the change touches
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          # A new branch or an unknown base: run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          if echo "$changed" | grep -qE '^(Routing|Edits)/|^global\.json$|^\.github/workflows/pr-gate\.yml$'; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(server|ingest)/|^\.github/workflows/pr-gate\.yml$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files:"; echo "$changed" | head -50

      - name: No Unity generated folders committed
        run: |
          bad=$(git ls-files | grep -E '^tablet/(Library|Temp|Obj|Build|Builds|Logs|UserSettings|MemoryCaptures)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unity generated files must not be committed:"
            echo "$bad" | head -20
            exit 1
          fi

      - name: Large files go through Git LFS
        run: |
          # Without `lfs: true` an LFS file is a small pointer, so any large file here bypassed LFS.
          limit=$((5 * 1024 * 1024))
          status=0
          while IFS= read -r -d '' file; do
            size=$(stat -c %s "$file")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$file::$((size / 1024 / 1024)) MB and not in Git LFS (see .gitattributes)"
              status=1
            fi
          done < <(git ls-files -z)
          exit $status

      - name: Unity assets have their .meta
        run: |
          status=0
          while IFS= read -r file; do
            if [ ! -e "$file.meta" ]; then
              echo "::error file=$file::missing $file.meta"
              status=1
            fi
          done < <(git ls-files 'tablet/Assets/*' | grep -v '\.meta$')
          exit $status

      - name: Set up .NET from global.json
        if: steps.changes.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Routing and Edits compile against netstandard2.1
        if: steps.changes.outputs.dotnet == 'true'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          dotnet build Routing/MartianMap.Routing.csproj -c Release
          dotnet build Edits/MartianMap.Edits.csproj -c Release

      - name: dotnet test (Routing, Edits)
        if: steps.changes.outputs.dotnet == 'true'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          dotnet test "Routing/Tests~/MartianMap.Routing.Tests.csproj" -c Release --logger "console;verbosity=normal"
          dotnet test "Edits/Tests~/MartianMap.Edits.Tests.csproj" -c Release --logger "console;verbosity=normal"

      - name: Set up uv and Python 3.12
        if: steps.changes.outputs.python == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.12"

      - name: pytest (server, ingest)
        if: steps.changes.outputs.python == 'true'
        run: |
          # Each Python folder with a pyproject.toml is its own project (docs/guide: one per folder).
          # A folder without one has no tests yet and is skipped.
          status=0
          for project in server ingest; do
            if [ ! -f "$project/pyproject.toml" ]; then
              echo "$project: no pyproject.toml, skipped"
              continue
            fi
            echo "::group::pytest $project"
            (cd "$project" && uv sync --locked && uv run --locked pytest -q) || status=1
            echo "::endgroup::"
          done
          exit $status
